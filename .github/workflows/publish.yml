name: publish

# Manual-trigger only, matching every other publish.yml in this org
# (ubx-sdk-*, ubx-schema-*): a human picks the real version and clicks
# "Run workflow" -- ubx-provider-dynamic has no mechanical version-
# derivation of its own (unlike a schema snapshot's own semver, which
# AssembleGroup derives from a real content diff), so the version is a
# real, maintainer-owned decision, the same way every ubx-sdk-*
# package.json/pyproject.toml version already is in this org.
#
# UBI-194: this is the first real release process ubx-provider-dynamic
# has ever had. Before this, the ONLY way to run it was building from a
# local checkout (UBX_PROVIDER_DYNAMIC_REPO) -- every real
# [providers.<name>] pin published so far (kubernetes/datadog/github/
# google/aws/azure) resolves a real schema snapshot but had nothing to
# serve it with outside this project. This publishes the real binary
# itself, per platform and architecture, with real checksums --
# provider.AcquireDynamicProviderBinary (ubiquex) is the real, matching
# consumer.
#
# -X ".../internal/snapshot.BinaryVersion=$VERSION" is what makes
# UBI-194's own real version-resolution design work at all: every
# snapshot generated by THIS exact release stamps this exact version
# into its own real, committed MinBinaryVersion (internal/snapshot's own
# doc comment has the full real reasoning) -- a real, unforgeable link
# between a published snapshot and the exact binary that can serve it,
# with no separate compatibility table to maintain.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Real, explicit semver to publish (e.g. 1.0.0) -- never \"latest\", matching every other real release in this org"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-provider-dynamic
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Refuse to republish an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released -- pick a real, new version" >&2
            exit 1
          fi

      - name: Cross-compile for every real, supported platform and architecture
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "building $os/$arch"
            out="dist/ubx-provider-dynamic_${v}_${os}_${arch}"
            mkdir -p "$out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -ldflags "-X github.com/ubiquex/ubx-provider-dynamic/internal/snapshot.BinaryVersion=$v" \
              -o "$out/ubx-provider-dynamic" \
              ./cmd/ubx-provider-dynamic
            tar czf "dist/ubx-provider-dynamic_${v}_${os}_${arch}.tar.gz" -C "$out" ubx-provider-dynamic
            rm -rf "$out"
          done

      - name: Compute one real SHA256SUMS covering every real platform archive
        run: |
          set -euo pipefail
          cd dist
          sha256sum ubx-provider-dynamic_*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          gh release create "v$v" dist/ubx-provider-dynamic_*.tar.gz dist/SHA256SUMS \
            --title "v$v" \
            --notes "ubx-provider-dynamic v$v -- real, published binary release (UBI-194). Built for linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, each with this exact version embedded (\`--version\` prints it). Every schema snapshot generated by this exact build stamps \`min_binary_version: \\\"$v\\\"\` into its own real, committed manifest.json."

      - name: Verify the release is real and carries every expected asset, queried independently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          gh release view "v$v" --json assets --jq '.assets[].name' | sort > got-assets
          {
            for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
              echo "ubx-provider-dynamic_${v}_${target}.tar.gz"
            done
            echo "SHA256SUMS"
          } | sort > want-assets
          if ! diff -u want-assets got-assets; then
            echo "release v$v does not have exactly the expected assets" >&2
            exit 1
          fi
          echo "v$v published with exactly the expected assets."
